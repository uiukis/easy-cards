<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0912F"/>
      <stop offset="0.55" stop-color="#DE6B12"/>
      <stop offset="1" stop-color="#C0560B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5B2503" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full-bleed background: safe for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- back card, peeking -->
  <g transform="rotate(12 256 262)">
    <rect x="150" y="120" width="212" height="292" rx="26" fill="#F6E7CE"/>
  </g>

  <!-- front card -->
  <g filter="url(#cardShadow)" transform="rotate(-9 256 262)">
    <rect x="132" y="108" width="248" height="316" rx="30" fill="#FBF4E6"/>
    <rect x="132" y="108" width="248" height="316" rx="30" fill="none" stroke="#1C140C" stroke-opacity="0.12" stroke-width="4"/>

    <!-- pokéball mark -->
    <g transform="translate(256 266)">
      <circle r="86" fill="#1C140C"/>
      <path d="M -86 0 A 86 86 0 0 1 86 0 Z" fill="#E4552B"/>
      <path d="M -86 0 A 86 86 0 0 0 86 0 Z" fill="#FBF4E6"/>
      <rect x="-86" y="-13" width="172" height="26" fill="#1C140C"/>
      <circle r="30" fill="#1C140C"/>
      <circle r="19" fill="#FBF4E6"/>
      <circle r="9" fill="#1C140C"/>
    </g>
  </g>
</svg>
